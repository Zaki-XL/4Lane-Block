<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>4Lane Block - 4レーン・ブロックソートパズル</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css?v=3.9">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-inner">
        <h1 class="title">4Lane Block</h1>
        <div class="header-actions">
          <select id="header-lang-select" class="header-lang-select" aria-label="言語切替">
            <option value="ja">日本語</option>
            <option value="en">English</option>
            <option value="zh">繁體/簡體中文</option>
            <option value="ko">한국어</option>
            <option value="es">Español</option>
            <option value="fr">Français</option>
          </select>
          <button id="help-btn" class="btn btn-help-header" title="遊び方・ゲームの目的と機能">❓ ヘルプ</button>
        </div>
      </div>
    </header>

    <!-- コントロール・ステータスパネル -->
    <section id="controls" class="control-container" aria-label="ゲーム操作パネル"></section>

    <!-- 4レーン盤面 -->
    <main id="board" class="board-container" aria-label="パズル盤面"></main>

    <!-- 操作説明 -->
    <footer class="instructions-panel">
      <h4 id="footer-title">💡 操作方法</h4>
      <div class="instructions-quick-list">
        <span id="footer-tap"><strong>タップ / クリック:</strong> 選択・移動</span>
        <span id="footer-drag"><strong>ドラッグ:</strong> 目的のレーンへ運ぶ</span>
        <span id="footer-keys"><strong>キー:</strong> <span class="key-badge">1</span>〜<span class="key-badge">4</span>、<span class="key-badge">←</span><span class="key-badge">→</span> + <span class="key-badge">Enter</span>、<span class="key-badge">Esc</span></span>
      </div>
    </footer>
  </div>

  <!-- クリアモーダル表示コンテナ -->
  <div id="modal-container"></div>

  <!-- ES Modules メインスクリプト -->
  <script type="module" src="./src/main.js?v=3.9"></script>
</body>
</html>
